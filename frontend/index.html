<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Marketing home page typography only: the landing page sets its own display
         and body faces on top of the console's stack. The console itself is drawn
         by Vazirmatn, which is self-hosted in /fonts (see styles/fonts.css) and
         needs no network — these two families are the only ones loaded from
         Google, and every page still renders correctly if they fail. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <title>ApartmentPro | Sign in</title>
    <!-- Theme before first paint. The choice lives in localStorage; resolving it
         here rather than in the app means a dark-mode visitor never sees a white
         flash while the bundle loads. Deliberately inline and synchronous — a
         deferred copy would run after the first frame, which is the flash. The
         store in src/stores/theme.js owns every change after this. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('apartmentpro.theme');
          var preference = stored === 'light' || stored === 'dark' ? stored : 'system';
          var dark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
